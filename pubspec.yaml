name: flutter_clean_architecture_steps
description:
  A Flutter learning project showing a progressive Clean Architecture journey,
  from a dirty starting point to a fully layered app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  cached_network_image: ^4.0.0
  connectivity_plus: ^7.3.1
  dio: ^5.11.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.2.1
  injectable: ^3.0.0
  intl: ^0.20.2
  path_provider: ^2.1.6
  rxdart: ^0.28.0
  skeletonizer: ^3.0.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.35.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
flutter_intl:
  enabled: true
