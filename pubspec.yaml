name: flutter_clean_architecture_steps
description:
  A Flutter learning project showing a progressive Clean Architecture journey,
  from a dirty starting point to a fully layered app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  intl: ^0.20.2
  skeletonizer: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
flutter_intl:
  enabled: true
