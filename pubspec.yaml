name: flutter_clean_architecture_steps
description:
  A Flutter learning project showing a progressive Clean Architecture journey,
  from a dirty starting point to a fully layered app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  connectivity_plus: ^7.3.1
  dio: ^5.11.1
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  path_provider: ^2.1.5
  rxdart: ^0.28.0
  skeletonizer: ^2.1.3

dev_dependencies:
  build_runner: ^2.4.15
  drift_dev: ^2.28.2
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
flutter_intl:
  enabled: true
