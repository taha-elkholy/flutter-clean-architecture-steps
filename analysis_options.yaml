include: package:very_good_analysis/analysis_options.yaml

analyzer:
  # Generated code is rewritten on every build, so lint fixes never survive.
  exclude:
    - lib/generated/**
    - "**/*.g.dart"

  language:
    strict-casts: true

linter:
  rules:
    # Off permanently — this is for published packages, not an app.
    public_member_api_docs: false