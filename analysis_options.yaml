include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - lib/generated/**
    - "**/*.g.dart"
    - build/**
    - android/**
    - ios/**

  language:
    strict-casts: true

linter:
  rules:
    # Off permanently — this is for published packages, not an app.
    public_member_api_docs: false