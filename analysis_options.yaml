include: package:very_good_analysis/analysis_options.yaml

analyzer:
  # Generated code is rewritten on every build, so lint fixes never survive.
  exclude:
    - lib/generated/**

  language:
    # Off until the models branch — dynamic Maps everywhere, will error out otherwise.
    strict-casts: false

linter:
  rules:
    # Off until the models branch — same reason as strict-casts.
    avoid_dynamic_calls: false

    # Off permanently — this is for published packages, not an app.
    public_member_api_docs: false